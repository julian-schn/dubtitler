# Per-job configuration. This is the file you edit when starting a new job;
# everything under src/ stays the same across jobs.

[project]
name = "Untitled"
# BCP-47-ish codes. Anything goes: a language pack is generated on first use
# if one does not exist in lang/.
source_lang = "de"
target_lang = "en"

[stt]
# Engines to run, in order. More than one enables cross-engine confidence
# flagging; three or more enables majority voting, which is markedly better
# than a pairwise disagreement flag.
engines = ["whisper-local", "elevenlabs"]

# Whose word timings anchor the cues. Must be one of the engines above.
# Leave empty to use the first available one.
spine = "elevenlabs"

# Pin a speech engine to a specific model, keyed by the names used above. Each
# engine ships a known-good default, so leave a line out unless you mean to
# change it; the point of pinning is that a job re-run months later transcribes
# the same way rather than following whatever a provider now calls "latest".
[models]
# whisper-local = "large-v3"
# elevenlabs = "scribe_v1"
# deepgram = "nova-3"
# openai = "whisper-1"

# Loudness normalisation applied to the audio handed to the speech engines.
# Separate from the dubbing one below: this exists to help recognition, that one
# to make a mix pleasant to listen to.
[audio]
loudnorm = "I=-16:TP=-1.5:LRA=11"

# What earns a segment a flag at gate 1. Raise these and the review document
# gets shorter and is actually read; lower them and it flags most of the video
# and gets skimmed. Two good engines disagree on roughly 20% of tokens on
# conversational speech, so the defaults are a deliberate trade of recall for
# precision. See CLAUDE.md before changing them.
[flags]
avg_logprob_floor = -0.6   # Whisper's mean logprob; clean speech sits above -0.45
no_speech_ceiling = 0.5    # above this the engine thinks it is not speech at all
word_prob_floor = 0.5      # below this a word counts as weak
word_prob_alarm = 0.35     # one word this weak flags the segment on its own
weak_word_cluster = 2      # or this many weak words together

[llm]
# "auto" uses the API when a key is present and otherwise emits prompts for a
# coding agent to answer. "anthropic" forces the API, "agent" forces prompts.
provider = "agent"
model = "claude-opus-5"

[subtitles]
max_line = 42          # characters per line
max_lines = 2
max_cps = 17.0         # reading speed
min_duration = 0.833   # 5/6 s, below this a cue reads as a flash
max_duration = 7.0
lead_out = 1.5         # how long a cue holds into the silence after it
gap = 0.084            # minimum gap between cues, seconds (two frames at 24fps)

[render]
font = "Arial"
font_size = 22         # at 720p; scaled by the source height
box_opacity = 0.85     # opaque box behind the text, 0 for an outline instead
margin = 40            # at 720p; scaled
crf = 18               # x264 quality for the burned-in copy

# Only consulted by `make dub`. The rest of the pipeline never reads this.
# Keep every key at this level: a nested table here replaces the whole section
# rather than merging into it, and the symptom is a KeyError from an unrelated
# step.
[dubbing]
# "kokoro" runs locally and free, but speaks only en, es, fr, hi, it, ja, pt and
# zh; it refuses at startup for anything else and says so. "elevenlabs" is paid
# and covers far more, including the Nordic and German languages this was built
# for. "rehearsal" synthesises a placeholder tone from the pack's speaking rate:
# no key, no network, no cost, so the whole chain can be run end to end before
# spending anything on a real voice.
engine = "kokoro"
voice = ""             # engine's voice id; empty means the engine's default
voice_model = ""       # engine's model id; empty means the engine's default

# Voiceover, not replacement: the original stays audible underneath, which is
# the archival convention for testimony and keeps the original voice checkable.
duck = 0.18            # the original's level while the dub is speaking
duck_fade = 0.25       # seconds ramping into and out of each ducked region

# How a translation that does not fit its timespan is made to fit, in the order
# the levers are pulled: the engine's own rate control, then time-stretching,
# then overrun into the following silence. A fourth lever, asking the model to
# rewrite the line shorter, is deliberately not implemented yet: it puts an LLM
# round-trip in the dub path, and nothing so far has needed it.
tolerance = 0.05       # overshoot accepted as-is, before anything is done
speed_max = 1.15       # ceiling on the engine's native rate control
atempo_max = 1.10      # ceiling on time-stretch; the artefact is audible above this
max_overrun = 1.0      # seconds a clip may run past its sentence, into silence
guard = 0.15           # seconds kept clear before the next clip starts

sample_rate = 48000
bitrate = "192k"
loudnorm = "I=-16:TP=-1.5:LRA=11"
char_warn = 20000      # projected characters above which `make dub` needs --spend
