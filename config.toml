# Per-job configuration. This is the file you edit when starting a new job;
# everything under src/ stays the same across jobs.

[project]
name = "Untitled"
# BCP-47-ish codes. Anything goes: a language pack is generated on first use
# if one does not exist in lang/.
source_lang = "de"
target_lang = "nb"

[stt]
# Engines to run, in order. More than one enables cross-engine confidence
# flagging; three or more enables majority voting, which is markedly better
# than a pairwise disagreement flag.
engines = ["whisper-local", "elevenlabs"]

# Whose word timings anchor the cues. Must be one of the engines above.
# Leave empty to use the first available one.
spine = "elevenlabs"

[llm]
# "auto" uses the API when a key is present and otherwise emits prompts for a
# coding agent to answer. "anthropic" forces the API, "agent" forces prompts.
provider = "auto"
model = "claude-opus-5"

[subtitles]
max_line = 42          # characters per line
max_lines = 2
max_cps = 17.0         # reading speed
min_duration = 0.833   # 5/6 s, below this a cue reads as a flash
max_duration = 7.0
lead_out = 1.5         # how long a cue holds into the silence after it
gap = 0.084            # minimum gap between cues, seconds (two frames at 24fps)

[render]
font = "Arial"
font_size = 22         # at 720p; scaled by the source height
box_opacity = 0.85     # opaque box behind the text, 0 for an outline instead
margin = 40            # at 720p; scaled
crf = 18               # x264 quality for the burned-in copy
