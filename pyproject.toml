[project]
name = "dubtitler"
version = "0.1.0"
description = "Agent-powered subtitling and dubbing: multi-engine transcription, sentence-level translation, and voiceover for any language pair"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julian Schniepp", email = "julian@schniepp.de" }]
keywords = ["subtitles", "dubbing", "transcription", "translation", "tts", "whisper"]
# No licence is set on purpose: all rights reserved for now. See the status
# section of README.md.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: German",
    "Natural Language :: Norwegian",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "srt>=3.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
whisper-local = [
    "mlx-whisper>=0.4.0; sys_platform == 'darwin'",
    "faster-whisper>=1.0.0; sys_platform != 'darwin'",
    # mlx-whisper asks for `numba` with no floor. Modern numba caps numpy, so
    # a resolver holding a newer numpy backtracks numba instead -- all the way
    # to 0.53, which predates Python 3.11 and fails to build with a message
    # about the Python version rather than about numpy. Pin the floor and let
    # numpy be the thing that moves.
    "numba>=0.61; sys_platform == 'darwin'",
]
elevenlabs = ["elevenlabs>=1.0.0"]
openai = ["openai>=1.0.0"]
deepgram = ["deepgram-sdk>=3.0.0"]
assemblyai = ["assemblyai>=0.30.0"]
anthropic = ["anthropic>=0.40.0"]
ner = ["spacy>=3.7.0"]
# Dubbing. The onnx build rather than the torch one: it is an order of magnitude
# smaller to install, and the two model files it wants are fetched once by hand
# (see src/dubtitler/tts/kokoro.py, which prints the commands).
kokoro = ["kokoro-onnx>=0.4.0", "soundfile>=0.12.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# A src layout, installed into the job's own venv so that
# `python -m dubtitler.steps.<name>` works from anywhere in the clone. Without
# this the Makefile works only where PYTHONPATH happens to be set.
[tool.hatch.build.targets.wheel]
packages = ["src/dubtitler"]
# Named explicitly: without it the editable install writes an empty path file
# and every documented command fails with ModuleNotFoundError.
dev-mode-dirs = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
