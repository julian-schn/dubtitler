# English language pack.

name = "English"
# Three-letter code. Cloud engines and the MP4 subtitle language tag both
# reject the two-letter form.
iso3 = "eng"
ner_model = "en_core_web_lg"

notes = """
English compounds are usually written open, which is the opposite of German and
Norwegian. Do not carry a never_trail intuition across from those packs.
"""

function_words = [
  "a", "an", "the", "and", "or", "but", "so", "as", "if", "than", "that",
  "this", "these", "those", "i", "you", "he", "she", "it", "we", "they",
  "me", "him", "her", "us", "them", "my", "your", "his", "its", "our",
  "is", "are", "was", "were", "be", "been", "am", "has", "have", "had",
  "do", "does", "did", "will", "would", "can", "could", "may", "might",
  "must", "shall", "should", "not", "no", "in", "on", "at", "to", "of",
  "for", "with", "from", "by", "about", "into", "over", "under", "after",
  "before", "through", "just", "very", "really", "uh", "um", "ah", "oh",
]

negations = [
  "not", "no", "never", "none", "nobody", "nothing", "neither", "nor",
  "without", "cannot",
]

break_before = [
  "and", "but", "or", "so", "because", "that", "which", "when", "while",
  "if", "after", "before", "to", "for", "with", "from",
]

