# Norwegian Bokmål language pack.

name = "Norwegian Bokmål"
# Three-letter code. Cloud engines and the MP4 subtitle language tag both
# reject the two-letter form.
iso3 = "nob"
# The MP4 subtitle tag uses the macrolanguage code instead. "nob" is Bokmål
# specifically and is correct, but "nor" is recognised by more players, and a
# tag a player does not know shows up in the menu as "Unknown".
mp4_lang = "nor"
ner_model = "nb_core_news_lg"

notes = """
Særskriving, wrongly splitting a compound into two words, is the most common
error in written Norwegian and the one an LLM is most likely to make, because
its Norwegian sits downstream of a great deal of English. The never_trail list
is what keeps a line break from landing inside a compound or between an article
and its noun.
"""

function_words = [
  "en", "et", "den", "det", "de", "denne", "dette", "disse",
  "og", "eller", "men", "for", "så", "at", "som", "når", "da", "fordi",
  "hvis", "der", "mens", "enn", "om", "jeg", "du", "han", "hun", "vi",
  "dere", "meg", "deg", "seg", "oss", "ham", "henne", "dem",
  "er", "var", "har", "hadde", "blir", "ble", "kan", "kunne", "må",
  "skal", "skulle", "vil", "ville", "ikke", "ingen", "noe", "noen",
  "i", "på", "til", "av", "med", "fra", "under", "over", "ved", "hos",
  "mot", "etter", "før", "gjennom", "uten", "mellom", "blant",
  "jo", "nå", "her", "bare", "også", "veldig", "helt",
]

negations = ["ikke", "ingen", "intet", "aldri", "verken", "uten", "ingenting"]

break_before = [
  "og", "men", "eller", "for", "så", "at", "som", "når", "da", "fordi",
  "hvis", "der", "mens", "enn", "om", "til", "med", "på", "i", "av", "fra",
]

never_trail = [
  "en", "et", "den", "det", "de", "min", "mitt", "mine", "din", "vår", "sin",
  "og", "men", "eller", "å", "som", "at", "i", "på", "til", "av", "med",
  "for", "fra", "om", "under", "over", "ved", "hos", "mot", "etter", "før",
  "gjennom", "uten", "mellom", "blant", "hver", "noen", "alle", "denne",
]

# Norwegian inflection is not folded: unlike German dialect elision, an ending
# here usually carries real grammatical information.
abbreviations = [
  "bl.a", "f.eks", "osv", "ca", "dvs", "jf", "kr", "nr", "pga", "mfl", "mht",
  "evt", "inkl", "ekskl", "dr", "prof", "st", "vs", "iht",
]

elision_suffixes = []

